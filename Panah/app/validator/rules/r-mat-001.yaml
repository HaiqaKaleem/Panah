id: R-MAT-001
name: Material quantities must be positive
description: "All materials in the constraint set must have positive available quantity."
category: material
severity: hard
reference: "Physical constraint — cannot build with zero or negative material inventory"
tags: [material, inventory]

rule:
  method: min_length
  field: constraints.materials
  min_length: 1

messages:
  pass: "At least one material is available"
  fail: "No materials defined in constraint set"
