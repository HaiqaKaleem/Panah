id: R-MAT-002
name: Material properties must be known
description: "Each material used must have known structural properties in the catalog."
category: material
severity: mandatory
reference: "Engineering requirement — structural analysis requires material data"
tags: [material, structural]

rule:
  method: min_length
  field: material_props
  min_length: 1

messages:
  pass: "Material properties are available for analysis"
  fail: "No material properties found in catalog — analysis cannot proceed"
