id: R-ENV-001
name: Environment scenario defined
description: "An environmental scenario must be defined for hazard assessment."
category: environment
severity: mandatory
reference: "Sphere Handbook — hazard conditions must be assessed before prescreening"
tags: [environment, sphere-handbook]

rule:
  method: not_empty
  field: constraints.environment.scenario

messages:
  pass: "Environmental scenario is defined"
  fail: "Environmental scenario is missing — hazard assessment required"
