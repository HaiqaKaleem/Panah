id: R-LOAD-001
name: Load path connectivity
description: "All load-bearing members must be connected in a load path to foundations."
category: load_path
severity: mandatory
reference: "Structural requirement — disconnected members cannot transfer loads"
tags: [structural, load-path]

rule:
  method: connectivity_check
  field: design.connections

messages:
  pass: "Load path is connected — {connected_count} members participate"
  fail: "Load path is incomplete — only {connected_count} members connected"
