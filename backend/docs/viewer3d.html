<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANAH — 3D Workspace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --nav:#0C252A;--bg:#131D1F;--bg2:#1a2a2d;
  --surface:rgba(19,29,31,0.92);--surface2:rgba(255,255,255,0.04);
  --card:#FFFFFF;--card2:#F4F8F9;--card3:#EAF5F9;
  --sage:#D5DDD2;--sage2:#ACBAA3;
  --accent:#D4A373;--green:#40916C;--green2:#52B788;
  --text:#1D1D1D;--text2:#555;--text3:#999;
  --text-inv:#FFFFFF;--text-inv2:rgba(255,255,255,0.7);
  --border:rgba(255,255,255,0.08);--border2:rgba(0,0,0,0.08);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text-inv);font-family:'Inter',system-ui,sans-serif}

#canvas-container{position:absolute;inset:0}
canvas{display:block}

/* === TOP NAV — exact match to screenshots === */
.nav{
  position:absolute;top:0;left:0;right:0;height:44px;z-index:100;
  display:flex;align-items:center;padding:0 20px;gap:20px;
  background:var(--nav);border-bottom:1px solid rgba(255,255,255,0.06);
}
.nav .brand{
  font-weight:700;font-size:15px;color:var(--text-inv);letter-spacing:2px;
  text-transform:uppercase;
}
.nav-links{display:flex;gap:4px;margin-left:20px}
.nav-link{
  padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;
  color:var(--text-inv2);cursor:pointer;transition:all 0.15s;
  display:flex;align-items:center;gap:5px;
}
.nav-link:hover{color:var(--text-inv);background:rgba(255,255,255,0.06)}
.nav-link.active{color:var(--text-inv);background:rgba(255,255,255,0.1)}
.nav-link svg{width:13px;height:13px;opacity:0.6}
.nav-spacer{flex:1}
.nav-icon{
  width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--text-inv2);font-size:14px;
}

/* === TOOLBAR (below nav) === */
.toolbar{
  position:absolute;top:44px;left:0;right:0;height:40px;z-index:99;
  display:flex;align-items:center;padding:0 20px;gap:6px;
  background:rgba(19,29,31,0.85);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.tool-btn{
  padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;
  color:var(--text-inv2);cursor:pointer;transition:all 0.15s;
  border:1px solid transparent;font-family:inherit;
  display:flex;align-items:center;gap:4px;
}
.tool-btn:hover{color:var(--text-inv);background:rgba(255,255,255,0.06)}
.tool-btn.active{color:#fff;background:var(--green);border-color:var(--green)}
.tool-sep{width:1px;height:20px;background:rgba(255,255,255,0.08);margin:0 4px}
.tool-spacer{flex:1}

/* === LEFT PANEL — matches Requirements dark sidebar === */
.panel-left{
  position:absolute;top:84px;left:0;width:310px;bottom:0;z-index:90;
  background:var(--nav);border-right:1px solid rgba(255,255,255,0.06);
  overflow-y:auto;
}
.panel-left::-webkit-scrollbar{width:3px}
.panel-left::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.pl-header{
  padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,0.06);
}
.pl-header h2{font-size:13px;font-weight:600;color:var(--text-inv);margin-bottom:2px}
.pl-header .sub{font-size:11px;color:var(--text-inv2)}
.pl-body{padding:10px 14px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.info-card{
  padding:10px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--border);
}
.info-card .v{font-size:18px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace}
.info-card .l{font-size:9px;color:var(--text-inv2);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}

.section-label{
  font-size:9px;color:var(--text-inv2);text-transform:uppercase;
  letter-spacing:1.2px;font-weight:600;margin:14px 0 6px;padding:0 4px;
}

.member-row{
  padding:8px 10px;border-radius:6px;margin-bottom:3px;cursor:pointer;
  border:1px solid transparent;transition:all 0.15s;
  display:flex;align-items:center;gap:8px;
}
.member-row:hover{background:rgba(255,255,255,0.04);border-color:var(--border)}
.member-row.sel{background:rgba(64,145,108,0.15);border-color:var(--green)}
.mem-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mem-info{flex:1;min-width:0}
.mem-name{font-size:11px;font-weight:600;color:var(--text-inv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-meta{font-size:9px;color:var(--text-inv2);font-family:'JetBrains Mono',monospace;margin-top:1px}

/* === RIGHT PANEL — matches light card style === */
.panel-right{
  position:absolute;top:84px;right:0;width:210px;z-index:90;
  background:var(--card);border-radius:0 0 0 10px;
  border-left:1px solid var(--border2);border-bottom:1px solid var(--border2);
  padding:14px;color:var(--text);
}
.pr-section{margin-bottom:14px}
.pr-title{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px}
.pr-row{display:flex;align-items:center;gap:6px;padding:2px 0}
.pr-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pr-label{font-size:11px;color:var(--text2)}

/* === BOTTOM BAR === */
.bottombar{
  position:absolute;bottom:0;left:310px;right:0;height:52px;z-index:90;
  display:flex;align-items:center;gap:0;
  background:var(--nav);border-top:1px solid rgba(255,255,255,0.06);
}
.bb-stat{
  flex:1;text-align:center;padding:6px 0;
  border-right:1px solid rgba(255,255,255,0.06);
}
.bb-stat:last-child{border-right:none}
.bb-stat .v{font-size:16px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace}
.bb-stat .l{font-size:8px;color:var(--text-inv2);text-transform:uppercase;letter-spacing:0.8px;margin-top:1px}

/* === TOOLTIP === */
.tip{
  position:absolute;pointer-events:none;z-index:200;
  background:var(--card);border:1px solid var(--border2);border-radius:8px;
  padding:10px 14px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,0.3);
  opacity:0;transition:opacity 0.12s;color:var(--text);
}
.tip.show{opacity:1}
.tip .t-name{font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px}
.tip .t-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);padding:1px 0}
.tip .t-row .t-v{color:var(--text);font-family:'JetBrains Mono',monospace}

/* === CROSS SECTION === */
.xsec{
  position:absolute;bottom:60px;right:0;width:220px;z-index:90;
  background:var(--card);border-radius:10px 0 0 0;
  border-left:1px solid var(--border2);border-top:1px solid var(--border2);
  padding:12px;color:var(--text);display:none;
}
.xsec.show{display:block}
.xsec .xs-title{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px}
.xsec canvas{border-radius:6px;width:100%;background:#f8f8f8}

/* === LOADING === */
.loader{
  position:absolute;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--nav);
}
.loader .brand{font-size:24px;font-weight:700;color:var(--text-inv);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px}
.loader .bar{width:180px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
.loader .fill{height:100%;width:0;background:var(--green);border-radius:2px;animation:ld 1.2s ease forwards}
@keyframes ld{to{width:100%}}
.loader .txt{margin-top:10px;font-size:11px;color:var(--text-inv2)}
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Nav — exact match to screenshots -->
<div class="nav">
  <div class="brand">PANAH</div>
  <div class="nav-links">
    <div class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>Home</div>
    <div class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Build</div>
    <div class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 00-8 0v2"/></svg>Material Library</div>
    <div class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>History</div>
    <div class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>Standards</div>
  </div>
  <div class="nav-spacer"></div>
  <div class="nav-icon">⚙</div>
  <div class="nav-icon">👤</div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <button class="tool-btn active" id="t-orbit" onclick="setMode('orbit')">🔄 Orbit</button>
  <button class="tool-btn" id="t-pan" onclick="setMode('pan')">✋ Pan</button>
  <button class="tool-btn" id="t-dolly" onclick="setMode('dolly')">🔍 Dolly</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="setView('front')">Front</button>
  <button class="tool-btn" onclick="setView('side')">Side</button>
  <button class="tool-btn" onclick="setView('top')">Top</button>
  <button class="tool-btn" onclick="setView('persp')" style="color:var(--accent)">3D</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="t-wire" onclick="toggle('wire')">Wire</button>
  <button class="tool-btn" id="t-dims" onclick="toggle('dims')">📏 Dims</button>
  <button class="tool-btn" id="t-nodes" onclick="toggle('nodes')">⊕ Nodes</button>
  <button class="tool-btn" id="t-edges" onclick="toggle('edges')">◻ Edges</button>
  <div class="tool-spacer"></div>
  <button class="tool-btn" onclick="reset()" style="color:var(--accent)">⟲ Reset</button>
</div>

<!-- Left Panel -->
<div class="panel-left">
  <div class="pl-header">
    <h2>Structure Inspector</h2>
    <div class="sub" id="design-label">Roof Truss — Loading...</div>
  </div>
  <div class="pl-body">
    <div class="info-grid" id="info-grid"></div>
    <div class="section-label">Members</div>
    <div id="member-list"></div>
  </div>
</div>

<!-- Right Panel -->
<div class="panel-right">
  <div class="pr-section">
    <div class="pr-title">Member Types</div>
    <div id="type-leg"></div>
  </div>
  <div class="pr-section">
    <div class="pr-title">Materials</div>
    <div id="mat-leg"></div>
  </div>
  <div class="pr-section">
    <div class="pr-title">Connections</div>
    <div id="conn-leg"></div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottombar">
  <div class="bb-stat"><div class="v" id="b-span">—</div><div class="l">Span</div></div>
  <div class="bb-stat"><div class="v" id="b-ht">—</div><div class="l">Ridge</div></div>
  <div class="bb-stat"><div class="v" id="b-w">—</div><div class="l">Width</div></div>
  <div class="bb-stat"><div class="v" id="b-n">—</div><div class="l">Members</div></div>
  <div class="bb-stat"><div class="v" id="b-l">—</div><div class="l">Total m</div></div>
  <div class="bb-stat"><div class="v" id="b-c">—</div><div class="l">Joints</div></div>
</div>

<!-- Tooltip -->
<div class="tip" id="tip">
  <div class="t-name"></div>
  <div class="t-row"><span>Type</span><span class="t-v" id="tp-type"></span></div>
  <div class="t-row"><span>Length</span><span class="t-v" id="tp-len"></span></div>
  <div class="t-row"><span>Diameter</span><span class="t-v" id="tp-dia"></span></div>
  <div class="t-row"><span>Material</span><span class="t-v" id="tp-mat"></span></div>
</div>

<!-- Cross Section -->
<div class="xsec" id="xsec">
  <div class="xs-title">Cross Section</div>
  <canvas id="xsec-cv" width="196" height="140"></canvas>
</div>

<!-- Loading -->
<div class="loader" id="loader">
  <div class="brand">PANAH</div>
  <div class="bar"><div class="fill"></div></div>
  <div class="txt">Building 3D model...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,mmesh=[],nsph=[],dlines=[],elines=[];
let sel=null,wire=0,dims=0,nd=0,ed=0,data=null,rc,ms;
let mode='orbit',sp={t:Math.PI/4,p:Math.PI/3.2,r:14},tg=new THREE.Vector3(0,1,2.5);
const C={beam:0x40916C,rafter:0xD4A373,brace:0x52B788,column:0x95D5B2,panel:0x6B9E7E};
const TN={beam:'Beam',rafter:'Rafter',brace:'Brace',column:'Column',panel:'Panel'};

function init(){
  const c=document.getElementById('canvas-container');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x131D1F);
  scene.fog=new THREE.FogExp2(0x131D1F,0.006);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,500);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  renderer.outputEncoding=THREE.sRGBEncoding;
  c.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xD5DDD2,0.3));
  const k=new THREE.DirectionalLight(0xFFF8E7,1.1);
  k.position.set(8,12,6);k.castShadow=true;
  k.shadow.mapSize.set(2048,2048);
  k.shadow.camera.near=0.5;k.shadow.camera.far=60;
  k.shadow.camera.left=-15;k.shadow.camera.right=15;
  k.shadow.camera.top=15;k.shadow.camera.bottom=-15;
  k.shadow.bias=-0.0005;scene.add(k);
  const f=new THREE.DirectionalLight(0xEAF5F9,0.25);f.position.set(-6,4,-4);scene.add(f);
  const r=new THREE.PointLight(0xD4A373,0.4,25);r.position.set(0,5,-8);scene.add(r);

  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x1a2a2d,roughness:0.95}));
  gnd.rotation.x=-Math.PI/2;gnd.position.y=-0.02;gnd.receiveShadow=true;scene.add(gnd);
  const grid=new THREE.GridHelper(30,30,0x243840,0x1a2a2d);grid.position.y=0.001;scene.add(grid);
  const ax=new THREE.AxesHelper(1.5);ax.position.set(0,0.01,0);scene.add(ax);

  rc=new THREE.Raycaster();ms=new THREE.Vector2();
  initCtrl();
  window.addEventListener('resize',onR);
  renderer.domElement.addEventListener('mousemove',onMM);
  renderer.domElement.addEventListener('click',onCl);
  animate();
}

let drag=0,prv={x:0,y:0};
function initCtrl(){
  const el=renderer.domElement;
  el.addEventListener('mousedown',e=>{drag=1;prv={x:e.clientX,y:e.clientY}});
  el.addEventListener('mousemove',e=>{
    if(!drag)return;const dx=e.clientX-prv.x,dy=e.clientY-prv.y;prv={x:e.clientX,y:e.clientY};
    if(mode==='orbit'){sp.t-=dx*0.004;sp.p=Math.max(0.05,Math.min(Math.PI-0.05,sp.p-dy*0.004))}
    else if(mode==='pan'){const s=sp.r*0.0015;const rv=new THREE.Vector3().crossVectors(camera.getWorldDirection(new THREE.Vector3()),new THREE.Vector3(0,1,0)).normalize();tg.add(rv.multiplyScalar(-dx*s));tg.y+=dy*s}
    else if(mode==='dolly'){sp.r=Math.max(2,Math.min(60,sp.r+dy*0.04))}
    uCam();
  });
  el.addEventListener('mouseup',()=>drag=0);el.addEventListener('mouseleave',()=>drag=0);
  el.addEventListener('wheel',e=>{e.preventDefault();sp.r=Math.max(2,Math.min(60,sp.r+e.deltaY*0.008));uCam()},{passive:false});
}
function uCam(){
  camera.position.x=tg.x+sp.r*Math.sin(sp.p)*Math.cos(sp.t);
  camera.position.y=tg.y+sp.r*Math.cos(sp.p);
  camera.position.z=tg.z+sp.r*Math.sin(sp.p)*Math.sin(sp.t);
  camera.lookAt(tg);
}

function build(d){
  data=d;
  mmesh.forEach(m=>scene.remove(m));nsph.forEach(n=>scene.remove(n));
  dlines.forEach(l=>scene.remove(l));elines.forEach(e=>scene.remove(e));
  mmesh=[];nsph=[];dlines=[];elines=[];

  d.members.forEach(mem=>{
    const s=new THREE.Vector3(mem.start.x,mem.start.y,mem.start.z);
    const e=new THREE.Vector3(mem.end.x,mem.end.y,mem.end.z);
    const dir=new THREE.Vector3().subVectors(e,s);const len=dir.length();
    const r=mem.radius||0.04;
    const geo=new THREE.CylinderGeometry(r,r,len,16,1);
    const col=C[mem.type]||0x888888;
    const mat=new THREE.MeshStandardMaterial({color:col,roughness:0.4,metalness:0.2});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=true;mesh.receiveShadow=true;
    mesh.position.copy(new THREE.Vector3().addVectors(s,e).multiplyScalar(0.5));
    mesh.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize()));
    mesh.userData={id:mem.id,type:mem.type,mat:mem.material_id,len:mem.height||len,r,label:mem.label||mem.id,desc:mem.description||''};
    scene.add(mesh);mmesh.push(mesh);

    const eg=new THREE.EdgesGeometry(geo);
    const el=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.12}));
    el.position.copy(mesh.position);el.quaternion.copy(mesh.quaternion);
    scene.add(el);elines.push(el);el.visible=ed;
  });

  if(d.nodes)Object.entries(d.nodes).forEach(([n,p])=>{
    const g=new THREE.SphereGeometry(0.06,16,16);
    const m=new THREE.MeshStandardMaterial({color:0xD4A373,emissive:0x3D2200,emissiveIntensity:0.4,roughness:0.3});
    const s=new THREE.Mesh(g,m);s.position.set(p.x,p.y,p.z);s.visible=nd;
    scene.add(s);nsph.push(s);
  });

  if(d.span_m){
    const g=new THREE.Group();
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-0.3,0),new THREE.Vector3(d.span_m,-0.3,0)]),new THREE.LineBasicMaterial({color:0xD4A373})));
    scene.add(g);dlines.push(g);
  }
  if(d.height_m){
    const g=new THREE.Group();const cx=d.span_m/2;
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(cx+0.3,0,0),new THREE.Vector3(cx+0.3,d.height_m,0)]),new THREE.LineBasicMaterial({color:0x52B788})));
    scene.add(g);dlines.push(g);
  }
  if(d.width_m>0){
    const g=new THREE.Group();
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-0.3,0,0),new THREE.Vector3(-0.3,0,d.width_m)]),new THREE.LineBasicMaterial({color:0x95D5B2})));
    scene.add(g);dlines.push(g);
  }
  dlines.forEach(l=>l.visible=dims);

  if(d.camera){sp.r=d.camera.distance;tg.set(d.camera.target.x,d.camera.target.y,d.camera.target.z);setView('persp')}
  uUI(d);
  setTimeout(()=>document.getElementById('loader').style.display='none',600);
}

function uUI(d){
  document.getElementById('design-label').textContent=`${d.design_type||'roof_truss'} — ${d.version||''}`;
  document.getElementById('b-span').textContent=d.span_m?d.span_m.toFixed(1)+'m':'—';
  document.getElementById('b-ht').textContent=d.height_m?d.height_m.toFixed(1)+'m':'—';
  document.getElementById('b-w').textContent=d.width_m?d.width_m.toFixed(1)+'m':'—';
  document.getElementById('b-n').textContent=d.member_count||d.members?.length||0;
  document.getElementById('b-l').textContent=d.total_member_length_m?d.total_member_length_m.toFixed(1):'—';
  document.getElementById('b-c').textContent=d.connection_count||0;

  let mh='';(d.members||[]).forEach(m=>{
    const c='#'+(C[m.type]||0x888888).toString(16).padStart(6,'0');
    mh+=`<div class="member-row" onclick="selM('${m.id}')" id="mr-${m.id}"><div class="mem-dot" style="background:${c}"></div><div class="mem-info"><div class="mem-name">${m.label||m.id}</div><div class="mem-meta">${TN[m.type]||m.type} · ${(m.height||0).toFixed(2)}m · ⌀${((m.radius||0)*2*1000).toFixed(0)}mm</div></div></div>`;
  });
  document.getElementById('member-list').innerHTML=mh;

  let th='';Object.entries(TN).forEach(([k,v])=>{
    const c='#'+(C[k]||0x888888).toString(16).padStart(6,'0');
    th+=`<div class="pr-row"><div class="pr-dot" style="background:${c}"></div><span class="pr-label">${v}</span></div>`;
  });
  document.getElementById('type-leg').innerHTML=th;

  let mh2='';if(d.materials)Object.values(d.materials).forEach(m=>{
    mh2+=`<div class="pr-row"><div class="pr-dot" style="background:${m.color.hex}"></div><span class="pr-label">${m.display_name}</span></div>`;
  });
  document.getElementById('mat-leg').innerHTML=mh2;

  document.getElementById('conn-leg').innerHTML=`
    <div class="pr-row"><div class="pr-dot" style="background:#D4A373;width:5px;height:5px;border-radius:50%"></div><span class="pr-label">Bolted</span></div>
    <div class="pr-row"><div class="pr-dot" style="background:#52B788;width:5px;height:5px;border-radius:50%"></div><span class="pr-label">Lashed</span></div>`;
}

function setMode(m){mode=m;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));document.getElementById('t-'+m)?.classList.add('active')}
function selM(id){
  mmesh.forEach(m=>m.material.emissiveIntensity=0);
  const mx=mmesh.find(m=>m.userData.id===id);
  if(mx){mx.material.emissiveIntensity=0.5;sel=mx;
    document.querySelectorAll('.member-row').forEach(c=>c.classList.remove('sel'));
    document.getElementById('mr-'+id)?.classList.add('sel');
    drawXS(mx.userData.r,mx.userData.type);}
}
function onMM(e){
  ms.x=(e.clientX/innerWidth)*2-1;ms.y=-(e.clientY/innerHeight)*2+1;
  rc.setFromCamera(ms,camera);const h=rc.intersectObjects(mmesh);
  const t=document.getElementById('tip');
  if(h.length>0){const u=h[0].object.userData;
    t.querySelector('.t-name').textContent=u.label||u.id;
    document.getElementById('tp-type').textContent=TN[u.type]||u.type;
    document.getElementById('tp-len').textContent=(u.len||0).toFixed(2)+'m';
    document.getElementById('tp-dia').textContent=((u.r||0)*2*1000).toFixed(0)+'mm';
    document.getElementById('tp-mat').textContent=u.mat||'—';
    t.style.left=(e.clientX+16)+'px';t.style.top=(e.clientY-16)+'px';t.classList.add('show');
    renderer.domElement.style.cursor='pointer';
  }else{t.classList.remove('show');renderer.domElement.style.cursor='default'}
}
function onCl(e){
  ms.x=(e.clientX/innerWidth)*2-1;ms.y=-(e.clientY/innerHeight)*2+1;
  rc.setFromCamera(ms,camera);const h=rc.intersectObjects(mmesh);
  if(h.length>0)selM(h[0].object.userData.id);
}
function setView(v){if(v==='front'){sp.t=0;sp.p=Math.PI/2}else if(v==='side'){sp.t=Math.PI/2;sp.p=Math.PI/2}else if(v==='top'){sp.t=0;sp.p=0.06}else{sp.t=Math.PI/4;sp.p=Math.PI/3.2}uCam()}
function reset(){sp.r=14;tg.set(0,1,2.5);setView('persp')}
function toggle(f){
  if(f==='wire'){wire=!wire;mmesh.forEach(m=>m.material.wireframe=wire);document.getElementById('t-wire').classList.toggle('active',wire)}
  if(f==='dims'){dims=!dims;dlines.forEach(l=>l.visible=dims);document.getElementById('t-dims').classList.toggle('active',dims)}
  if(f==='nodes'){nd=!nd;nsph.forEach(n=>n.visible=nd);document.getElementById('t-nodes').classList.toggle('active',nd)}
  if(f==='edges'){ed=!ed;elines.forEach(e=>e.visible=ed);document.getElementById('t-edges').classList.toggle('active',ed)}
}
function drawXS(r,type){
  const cv=document.getElementById('xsec-cv'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const cx=cv.width/2,cy=cv.height/2,sc=Math.min(cv.width,cv.height)/(r*8),rad=r*sc;
  ctx.fillStyle='#f8f9fa';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#e0e0e0';ctx.lineWidth=0.5;
  for(let i=0;i<cv.width;i+=14){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,cv.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(cv.width,i);ctx.stroke()}
  const col='#'+(C[type]||0x888888).toString(16).padStart(6,'0');
  const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);grd.addColorStop(0,col+'66');grd.addColorStop(1,col+'11');
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-rad,cy);ctx.lineTo(cx+rad,cy);ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#1D1D1D';ctx.font='500 10px JetBrains Mono,monospace';ctx.textAlign='center';
  ctx.fillText(`⌀ ${(r*2*1000).toFixed(0)}mm`,cx,cy+rad+16);
  ctx.fillText(TN[type]||type,cx,cy-rad-8);
  document.getElementById('xsec').classList.add('show');
}
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}
function onR(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
