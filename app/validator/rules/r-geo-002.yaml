id: R-GEO-002
name: Member length must not exceed material stock
description: "Each member's length must not exceed the longest available material piece."
category: geometry
severity: hard
reference: "Physical constraint — member cannot be longer than the stock material"
tags: [geometry, structural]

rule:
  method: max_threshold
  field: design.span_m
  threshold: 6.0

messages:
  pass: "Member length is within material stock limits"
  fail: "Design span ({value}m) exceeds maximum material stock length ({threshold}m)"
